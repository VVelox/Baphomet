---
# Matches Authelia authentication failures, first factor and second, in its
# own log file with log.format: json. Based on the fail2ban authelia filter's
# json logtype. The default text format is raw/authelia's (own file) and
# syslog/authelia's (syslog or the journal).
#
# The offender is the remote_ip field, which the account the client typed
# into msg can not reach.
rev: 1
msg: "[AUTHELIA] authentication failure"
severity: high
classtype: brute-force
mark:
  - name: brute_force
    ttl: 21600
gate:
  - field: msg
    values: [ "//^Unsuccessful \\S+ authentication attempt by user //" ]
match:
  - field: remote_ip
    regexp: '^%%%%SRC%%%%$'
src_ip_var: SRC
ban_var:
  - SRC
tests:
  positive:
    - message: '{"error":"authentication failed. Cause: error occurred performing bind: LDAP Result Code 49 \"Invalid Credentials\": ","level":"error","method":"POST","msg":"Unsuccessful 1FA authentication attempt by user ''example''","path":"/api/firstfactor","remote_ip":"192.0.2.4","time":"2025-06-24T15:49:10+02:00"}'
      found: 1
      data:
        SRC: "192.0.2.4"
    - message: '{"error":"authentication failed","level":"error","method":"POST","msg":"Unsuccessful TOTP authentication attempt by user ''admin''","path":"/api/secondfactor/totp","remote_ip":"2001:db8::1","time":"2025-06-24T15:49:10+02:00"}'
      found: 1
      data:
        SRC: "2001:db8::1"
    - message: '{"level":"error","remote_ip":"192.0.2.100","msg":"Unsuccessful WebAuthn authentication attempt by user ''alice''","time":"2025-06-24T15:49:10+02:00"}'
      found: 1
      data:
        SRC: "192.0.2.100"
  negative:
    - message: '{"level":"info","method":"POST","msg":"Successful 1FA authentication attempt by user ''example''","path":"/api/firstfactor","remote_ip":"192.0.2.4","time":"2025-06-24T15:50:00+02:00"}'
      found: 0
      undefed: ["SRC"]
  injection:
    # an address typed into the account... the offender is remote_ip
    - message: '{"level":"error","msg":"Unsuccessful 1FA authentication attempt by user ''x remote_ip=198.51.100.66''","remote_ip":"192.0.2.101","time":"2025-06-24T15:49:11+02:00"}'
      data:
        SRC: "192.0.2.101"
