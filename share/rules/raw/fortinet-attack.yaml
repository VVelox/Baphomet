---
# The FortiGate's own IPS naming an attacker. FortiOS speaks syslog
# natively in key=value, so this raw rule anchors on the logid, never
# the line's head. Folded from sagan-rules fortinet.rules: attack
# detected by UDP/TCP signature (0419016384), by ICMP signature
# (0419016385), by malicious URL (0421016399), by the anomaly engine's
# catch-all (0720018434), and the legacy 4.0 attack-signature pair
# (70000, 73001... the log_id=/src= dialect). Sagan's noise trims ride
# along as ignore_regexp... severity low/info hits, the
# SSL.Anonymous.Ciphers chatter, and the already-answered "URL blocked"
# notices. One departure: Sagan also dropped action="dropped" hits, but
# a packet the FortiGate answered still names an attacker worth
# counting, so those count here. Both ends of a flow are logged and an
# outbound hit puts your own host in srcip=, so ban_not_internal spares
# your own.
rev: 1
msg: "[FORTINET] attack detected by IPS"
severity: high
classtype: misc-attack
references:
  - https://fortinetweb.s3.amazonaws.com/docs.fortinet.com/v2/attachments/b43f86b1-9e63-11ed-8e6d-fa163e15d75b/FortiOS_7.2.4_Log_Reference.pdf
message_regexp:
  - 'logid="(?:0419016384|0419016385|0421016399|0720018434)" type="utm".*?srcip=%%%%SRC%%%%'
  - 'log_?id="?\d*(?:70000|73001)"? type=.*?src(?:ip)?=%%%%SRC%%%%'
ignore_regexp:
  - 'severity="(?:low|info)"'
  - 'SSL\.Anonymous\.Ciphers'
  - 'URL blocked '
ban_var:
  - SRC
ban_not_internal: true
tests:
  positive:
    - message: 'Jul 12 09:01:12 fw01 date=2026-07-12 time=09:01:12 devname="FGT100F" devid="FG100FTK20012345" logid="0419016384" type="utm" subtype="ips" eventtype="signature" level="alert" vd="root" eventtime=1752328872000000000 tz="-0500" severity="critical" srcip=203.0.113.66 srccountry="Reserved" dstip=192.168.1.20 dstcountry="Reserved" srcintf="wan1" srcintfrole="wan" dstintf="lan" dstintfrole="lan" sessionid=402716 action="detected" proto=6 service="HTTP" policyid=1 attack="SQL.Injection" srcport=51345 dstport=80 hostname="www.example.com" url="/login.php?id=1" direction="outgoing" attackid=15621 profile="protect_servers" ref="http://www.fortinet.com/ids/VID15621" incidentserialno=163842013 msg="applications3: SQL.Injection"'
      found: 1
      data:
        SRC: "203.0.113.66"
    - message: 'Jul 12 09:05:40 fw01 date=2026-07-12 time=09:05:40 devname="FGT100F" devid="FG100FTK20012345" logid="0421016399" type="utm" subtype="ips" eventtype="malicious-url" level="alert" vd="root" eventtime=1752329140000000000 tz="-0500" severity="high" srcip=198.51.100.14 dstip=192.168.1.20 srcintf="wan1" dstintf="lan" sessionid=402801 action="detected" proto=6 service="HTTP" attack="Malicious.URL" srcport=44821 dstport=80 url="/cgi-bin/../../etc/passwd" direction="incoming" msg="malicious-url: Malicious.URL"'
      found: 1
      data:
        SRC: "198.51.100.14"
    - message: 'Jul 12 09:07:02 fw01 date=2026-07-12 time=09:07:02 log_id=73001 type=attack subtype=attack_signature pri=alert attack_id=107347973 src=198.51.100.99 dst=192.168.1.5 src_port=4432 dst_port=80 src_int=wan1 dst_int=internal status=detected proto=6 service=http msg="web_app3: PHP.CGI.Argument.Injection"'
      found: 1
      data:
        SRC: "198.51.100.99"
  negative:
    - message: 'Jul 12 09:10:00 fw01 date=2026-07-12 time=09:10:00 devname="FGT100F" devid="FG100FTK20012345" logid="0419016384" type="utm" subtype="ips" eventtype="signature" level="notice" vd="root" eventtime=1752329400000000000 tz="-0500" severity="low" srcip=198.51.100.30 dstip=192.168.1.20 action="detected" attack="TCP.Window.Size.Zero" msg="applications3: TCP.Window.Size.Zero"'
      found: 0
      undefed: ["SRC"]
    - message: 'Jul 12 09:11:30 fw01 date=2026-07-12 time=09:11:30 devname="FGT100F" devid="FG100FTK20012345" logid="0419016384" type="utm" subtype="ips" eventtype="signature" level="alert" vd="root" eventtime=1752329490000000000 tz="-0500" severity="medium" srcip=198.51.100.31 dstip=192.168.1.20 action="detected" attack="SSL.Anonymous.Ciphers.Negotiation" msg="applications3: SSL.Anonymous.Ciphers.Negotiation"'
      found: 0
      undefed: ["SRC"]
    - message: 'Jul 12 09:12:00 fw01 date=2026-07-12 time=09:12:00 devname="FGT100F" devid="FG100FTK20012345" logid="0000000013" type="traffic" subtype="forward" level="notice" vd="root" eventtime=1752329520000000000 tz="-0500" srcip=192.168.1.30 dstip=203.0.113.10 action="accept" service="HTTPS" msg=""'
      found: 0
      undefed: ["SRC"]
