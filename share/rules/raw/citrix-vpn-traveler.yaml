---
# The impossible traveler... a login, or a login failure, for an
# account that already logged in from somewhere else inside the brand's
# eight hours. One body, two roads. Reads the citrix-vpn-login-src
# brand that raw/citrix-vpn-mark-logins sets... list this rule BEFORE
# the setter in the watcher, so the gate sees the source that
# established the account rather than the one the same line would
# re-brand it with. Based on sagan-rules citrix.rules sids 5007210,
# 5007212, and 5007213, the impossible traveler set, their
# flexbits isset,username / isnotset,by_src pair carried as the
# var/value_not mark gate... the two Sagan classtypes
# (successful-user, unsuccessful-user) fold to suspicious-login for
# the pair. Sid 5007211's VPN.Login.Failed bit is skipped... nothing
# in the corpus reads it. Detection-only, since a travelling login is
# a question, not a verdict... flip detection_var to ban_var to make
# it act. NetScaler emits syslog natively but stuffs the date where
# the program name goes, so this is a raw rule anchored on the
# SSLVPN and AAA module tokens, never on line start. The embedded
# tests seed the setter's brand (marks_before) and so prove the gate
# both ways... a second source fires, the established one and the
# unbranded do not.
rev: 4
msg: "[CITRIX] impossible traveler... VPN account seen from a second source"
severity: high
classtype: suspicious-login
references:
  - https://support.citrix.com/article/CTX123875
message_regexp:
  # GREEDY, not lazy, and that is the whole defence. A NetScaler LOGIN line
  # opens with Context <user>@<addr>, so the account name... whatever the
  # client typed... appears AHEAD of the real User/Client_ip pair. Lazy, the
  # first "User " found is one an attacker can plant in their own name, and
  # both the account and the address come back theirs. Greedy takes the LAST,
  # which is the pair NetScaler wrote, and a forged one can only ever sit
  # earlier. The format is too irregular to decompose (SessionId: 7- runs the
  # separator together, and a Browser_type holds dashes of its own), so the
  # anchor is the ordering rather than a parse.
  #
  # Greedy up to the first double quote, and no further. The line CLOSES with
  # Browser_type, the client's own User-Agent, so a pair can be planted BEHIND
  # the real one as well, where a greedy run to the end of the line takes it
  # for the last. Everything NetScaler writes after the real pair is behind a
  # quoted value... Nat_ip "Mapped Ip" at once, and a User-Agent is itself
  # inside quotes... so a run that can not cross a double quote ends at the
  # real pair and never sees what the client sent.
  - ' SSLVPN LOGIN \d+ \d+ :[^"]*User (?<USER>\S+) - Client_ip %%%%SRC%%%%'
  - ' AAA LOGIN_FAILED \d+ \d+ :\s+User (?<USER>\S+) - Client_ip %%%%SRC%%%%'
marked:
  - name: citrix-vpn-login-src
    var: USER
    value_not: SRC
src_ip_var: SRC
user_var: USER
detection_var:
  - SRC
max_score: 1
tests:
  positive:
    - message: "Jul 12 08:16:02 ns01 07/12/2026:08:16:02 GMT ns01 0-PPE-0 : default SSLVPN LOGIN 4350 0 : Context jdoe@198.51.100.60 - SessionId: 7- User jdoe - Client_ip 198.51.100.60 - Nat_ip \"Mapped Ip\" - Vserver 192.0.2.1:443 - Browser_type \"Mozilla/5.0\" - SSLVPN_client_type ICA - Group(s) \"N/A\""
      marks_before:
        - name: citrix-vpn-login-src
          key: jdoe
          value: "203.0.113.5"
      found: 1
      data:
        USER: "jdoe"
        SRC: "198.51.100.60"
    - message: "Jul 12 08:15:50 ns01 07/12/2026:08:15:50 GMT ns01 0-PPE-0 : default AAA LOGIN_FAILED 4344 0 : User jdoe - Client_ip 198.51.100.61 - Failure_reason \"Invalid credentials passed\" - Browser Mozilla/5.0"
      marks_before:
        - name: citrix-vpn-login-src
          key: jdoe
          value: "203.0.113.5"
      found: 1
      data:
        USER: "jdoe"
        SRC: "198.51.100.61"
  injection:
    # The User-Agent is whatever the client sends and lands in Browser_type,
    # BEHIND the real pair, so a forged pair can be planted there. It is past
    # a double quote, which the match can not cross, so it is never seen...
    # a greedy run to the end of the line took moth3r at 198.51.100.200 here.
    - message: "Jul 12 08:16:02 ns01 07/12/2026:08:16:02 GMT ns01 0-PPE-0 : default SSLVPN LOGIN 4350 0 : Context jdoe@203.0.113.5 - SessionId: 5- User jdoe - Client_ip 203.0.113.5 - Nat_ip \"Mapped Ip\" - Vserver 192.0.2.1:443 - Browser_type \"Mozilla/5.0 - User moth3r - Client_ip 198.51.100.200 - x\" - SSLVPN_client_type ICA - Group(s) \"N/A\""
      marks_before:
        - name: citrix-vpn-login-src
          key: jdoe
          value: "192.0.2.99"
      data:
        USER: "jdoe"
        SRC: "203.0.113.5"
    # A account name holding a forged pair, which sits in Context AHEAD of the
    # real one. Greedy matching takes the last pair ahead of the first double
    # quote, which is NetScaler's own.
    - message: "Jul 12 08:16:02 ns01 07/12/2026:08:16:02 GMT ns01 0-PPE-0 : default SSLVPN LOGIN 4350 0 : Context User moth3r - Client_ip 198.51.100.200@203.0.113.5 - SessionId: 5- User jdoe - Client_ip 203.0.113.5 - Nat_ip \"Mapped Ip\" - Vserver 192.0.2.1:443 - Browser_type \"Mozilla/5.0\" - SSLVPN_client_type ICA - Group(s) \"N/A\""
      marks_before:
        - name: citrix-vpn-login-src
          key: jdoe
          value: "192.0.2.99"
      data:
        USER: "jdoe"
        SRC: "203.0.113.5"
  negative:
    - message: "Jul 12 08:16:05 ns01 07/12/2026:08:16:05 GMT ns01 0-PPE-0 : default SSLVPN LOGOUT 4351 0 : Context jdoe@203.0.113.5 - SessionId: 5- User jdoe - Client_ip 203.0.113.5 - Nat_ip \"Mapped Ip\" - Vserver 192.0.2.1:443 - Start_time \"07/12/2026:08:16:02 GMT\" - End_time \"07/12/2026:08:16:05 GMT\""
      found: 0
      undefed: ["SRC"]
    - message: "Jul 12 08:15:50 ns01 07/12/2026:08:15:50 GMT ns01 0-PPE-1 : default APPFW APPFW_STARTURL 60 0 :  203.0.113.62 616-PPE1 - webfw_prof http://www.example.com/FFC/login.php Disallow Illegal URL. <blocked>"
      found: 0
      undefed: ["SRC"]
    # a matching login for an account never branded... the gate vetoes
    - message: "Jul 12 08:16:02 ns01 07/12/2026:08:16:02 GMT ns01 0-PPE-0 : default SSLVPN LOGIN 4350 0 : Context jdoe@198.51.100.60 - SessionId: 7- User jdoe - Client_ip 198.51.100.60 - Nat_ip \"Mapped Ip\" - Vserver 192.0.2.1:443 - Browser_type \"Mozilla/5.0\" - SSLVPN_client_type ICA - Group(s) \"N/A\""
      found: 0
    # and the established source on its own account is one body, one road
    - message: "Jul 12 08:16:02 ns01 07/12/2026:08:16:02 GMT ns01 0-PPE-0 : default SSLVPN LOGIN 4350 0 : Context jdoe@203.0.113.5 - SessionId: 5- User jdoe - Client_ip 203.0.113.5 - Nat_ip \"Mapped Ip\" - Vserver 192.0.2.1:443 - Browser_type \"Mozilla/5.0\" - SSLVPN_client_type ICA - Group(s) \"N/A\""
      marks_before:
        - name: citrix-vpn-login-src
          key: jdoe
          value: "203.0.113.5"
      found: 0
