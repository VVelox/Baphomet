---
# The network complaining about itself... the telemetry rules of
# sagan-rules huawei.rules, five folded into one detection: a duplicate
# IP heard on ARP, the box's own DHCP client NAKed, the DHCP client
# acquiring a lease (Sagan's two REQIP_SUCCESS variants, vlan and plain,
# are one shape here), and a VRRP packet failing authentication. None of
# these is an offender to banish... a duplicate address is a misconfig
# or a neighbor's, a NAK is the server's word, a lease is housekeeping,
# and the VRRP peer is your own HA partner, so this sights to EVE with
# the interface or address as the subject. Sagan classed the VRRP
# failure unsuccessful-user; it is carried here as suspicious-traffic
# with its siblings, network health being what it actually is. VRP
# speaks syslog natively; the %%01 info-center framing is the one
# realistic shape assumed, the severity digit left loose.
rev: 1
msg: "[HUAWEI] network health event"
severity: low
classtype: suspicious-traffic
references:
  - http://www.huaweisymantec.com/en/download.do?id=658891
message_regexp:
  - 'ARP/\d/ARP_DUPLICATE_IPADDR\S*:.*?\bIpAddress=%%%%ADDR%%%%'
  - 'DHCPC/\d/DHCPC_LOG_NAK\S*:.*?\bInterfaceName=(?<IFACE>[^,)\s]+)'
  - 'DHCPC/\d/DHCPC_LOG_REQIP_SUCCESS\S*:.*?[Ii]nterface (?<IFACE>\S+) has acquired ip address'
  - 'VRRP/\d/LogAuthFailed\S*:.*?\bfrom %%%%ADDR%%%%'
detection_var:
  - ADDR
  - IFACE
tests:
  positive:
    - message: 'Jul 12 08:15:50 sw01 %%01ARP/4/ARP_DUPLICATE_IPADDR(l): Received an ARP packet with a duplicate IP address. (IpAddress=192.168.1.10, InterfaceName=GigabitEthernet0/0/1, MacAddress=00e0-fc12-3456)'
      found: 1
      data:
        ADDR: "192.168.1.10"
    - message: 'Jul 12 08:15:51 sw01 %%01DHCPC/4/DHCPC_LOG_NAK(l): The DHCP client received a NAK packet. (InterfaceName=Vlanif100, ServerIp=192.168.1.1)'
      found: 1
      data:
        IFACE: "Vlanif100"
    - message: 'Jul 12 08:15:52 sw01 %%01DHCPC/4/DHCPC_LOG_REQIP_SUCCESS(l): The interface Vlanif100 has acquired ip address 192.168.1.50 successfully.'
      found: 1
      data:
        IFACE: "Vlanif100"
    - message: 'Jul 12 08:15:53 sw01 %%01VRRP/3/LogAuthFailed(l): Received a VRRP packet that failed authentication from 192.168.1.3 on interface Vlanif100. (VRID=10)'
      found: 1
      data:
        ADDR: "192.168.1.3"
  negative:
    - message: 'Jul 12 08:25:49 sw01 %%01DHCPC/4/DHCPC_LOG_RELEASE(l): The interface Vlanif100 released its ip address 192.168.1.50.'
      found: 0
      undefed: ["ADDR", "IFACE"]
    - message: 'Jul 12 08:25:50 sw01 %%01ARP/4/ARP_LEARN(l): Learned an ARP entry. (IpAddress=192.168.1.20, InterfaceName=GigabitEthernet0/0/2)'
      found: 0
      undefed: ["ADDR", "IFACE"]
