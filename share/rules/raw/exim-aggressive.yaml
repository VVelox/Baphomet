---
# The rest of fail2ban's exim filter, its "more" and "aggressive" modes, in
# the exim mainlog: SMTP abuse that is not a failed login. raw/exim counts
# the auth failures and the commonest rejects, and this takes what it leaves:
#
#   no MAIL in SMTP connection from ...              a connection that sent no mail
#   SMTP protocol error in "AUTH LOGIN" ... AUTH command used when not advertised
#   SMTP connection from ... closed by DROP in ACL   your own ACL dropping it
#   SMTP call from ... dropped: too many unrecognized commands
#   ... rejected RCPT <x>: <any other reason>
#   no host name found for IP address <addr>         no reverse DNS
#   no IP address found for host <h> (during SMTP connection from ...)
#   H=[<addr>] dropped by 'connect' ACL: ...
#
# The two DNS ones are not abuse at all on a misconfigured sender's part, and
# an MTA facing the internet sees all of these from honest-but-broken peers.
# Opt in knowingly, beside raw/exim and not instead of it. The two never take
# the same line... the RCPT reasons raw/exim counts are left out here, as are
# the drop shapes it already reads... so the order they are listed in and the
# overlap setting do not matter.
#
# The address comes ahead of anything the client wrote on every line but one.
# The protocol error quotes the command the client sent, which may hold a
# whole forged ' H=(x) [<addr>]', so there the quoted part is greedy and the
# line has to end on exim's own verdict... the last address on it is exim's.
#
# A syslog "<host> exim[<pid>]:", after exim's timestamp or ahead of it, is
# taken as raw/exim takes it. Keep the two prefixes in step.
rev: 2
msg: "[EXIM] SMTP abuse (aggressive)"
severity: medium
classtype: network-scan
mark:
  - name: recon
    ttl: 86400
message_regexp:
  # no MAIL in SMTP connection from [host] (helo) [addr]:port I=... D=... C=...
  - '^(?:[\w.-]+ exim\[\d+\]: )?\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)?(?: [+-]\d{4})?(?: [\w.-]+ exim\[\d+\]:)?(?: \[\d+\])? no MAIL in SMTP connection from (?:[\w.-]+ )?(?:\(\S+\) )?\[(?:IPv6:)?%%%%SRC%%%%\](?::\d+)?(?: [A-Za-z]{1,4}=\S+)*\s*$'
  # SMTP protocol error in "<the client's command>" H=... [addr] AUTH command used when not advertised
  - '^(?:[\w.-]+ exim\[\d+\]: )?\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)?(?: [+-]\d{4})?(?: [\w.-]+ exim\[\d+\]:)?(?: \[\d+\])? SMTP protocol error in ".*" H=(?:[\w.-]+ )?(?:\(\S+\) )?\[(?:IPv6:)?%%%%SRC%%%%\](?::\d+)?(?: [A-Za-z]{1,4}=\S+)* [A-Za-z]+ (?:command used when not advertised|authentication mechanism not supported)\s*$'
  # [msgid] SMTP connection from ... closed by DROP in ACL
  - '^(?:[\w.-]+ exim\[\d+\]: )?\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)?(?: [+-]\d{4})?(?: [\w.-]+ exim\[\d+\]:)?(?: \[\d+\])?(?: [0-9A-Za-z]{6,}-[0-9A-Za-z]{6,}-[0-9A-Za-z]{2,})? SMTP connection from (?:[\w.-]+ )?(?:\(\S+\) )?\[(?:IPv6:)?%%%%SRC%%%%\](?::\d+)?(?: [A-Za-z]{1,4}=\S+)* closed by DROP in ACL\s*$'
  # SMTP call from ... dropped: too many unrecognized commands, and the
  # nonmail / syntax drops with a ", C=..." after the last command, which
  # raw/exim does not read
  - '^(?:[\w.-]+ exim\[\d+\]: )?\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)?(?: [+-]\d{4})?(?: [\w.-]+ exim\[\d+\]:)?(?: \[\d+\])? SMTP call from (?:[\w.-]+ )?(?:H=(?:[\w.-]+ )?(?:\(\S+\) )?)?\[(?:IPv6:)?%%%%SRC%%%%\](?::\d+)?(?: [A-Za-z]{1,4}=\S+)* dropped: too many (?:unrecognized commands|(?:nonmail commands|syntax or protocol errors) \(last (?:command )?was ".*",\s+C=\S+\))'
  # a RCPT rejected for any reason raw/exim does not count
  - '^(?:[\w.-]+ exim\[\d+\]: )?\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)?(?: [+-]\d{4})?(?: [\w.-]+ exim\[\d+\]:)?(?: \[\d+\])? (?:H=(?:[\w.-]+ )?(?:\(\S+\) )?)?\[(?:IPv6:)?%%%%SRC%%%%\](?::\d+)?(?: [A-Za-z]{1,4}=\S+)* rejected RCPT [^@]+@\S+: (?!(?:relay not permitted|Sender verify failed|Unknown user|Unrouteable address)\s*$).+$'
  # no reverse DNS for the peer
  - '^(?:[\w.-]+ exim\[\d+\]: )?\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)?(?: [+-]\d{4})?(?: [\w.-]+ exim\[\d+\]:)?(?: \[\d+\])? no host name found for IP address %%%%SRC%%%%\s*$'
  # a reverse name that does not resolve forward
  - '^(?:[\w.-]+ exim\[\d+\]: )?\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)?(?: [+-]\d{4})?(?: [\w.-]+ exim\[\d+\]:)?(?: \[\d+\])? no IP address found for host \S+ \(during SMTP connection from (?:[\w.-]+ )?(?:\(\S+\) )?\[(?:IPv6:)?%%%%SRC%%%%\](?::\d+)?(?: [A-Za-z]{1,4}=\S+)*\)\s*$'
  # H=[addr]:port dropped by 'connect' ACL: <reason>
  - '^(?:[\w.-]+ exim\[\d+\]: )?\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}(?:\.\d+)?(?: [+-]\d{4})?(?: [\w.-]+ exim\[\d+\]:)?(?: \[\d+\])? H=(?:[\w.-]+ )?(?:\(\S+\) )?\[(?:IPv6:)?%%%%SRC%%%%\](?::\d+)?(?: [A-Za-z]{1,4}=\S+)* dropped by ''[^'']+'' ACL:'
src_ip_var: SRC
ban_var:
  - SRC
tests:
  positive:
    - message: '2016-03-21 06:38:05 [5718] no MAIL in SMTP connection from www3005.example.jp [192.0.2.15]:28890 I=[192.0.2.6]:25 D=21s C=EHLO,STARTTLS'
      found: 1
      data:
        SRC: "192.0.2.15"
    - message: '2016-03-21 06:57:36 [5908] no MAIL in SMTP connection from [192.0.2.116] I=[192.0.2.6]:25 D=10s'
      found: 1
      data:
        SRC: "192.0.2.116"
    # with exim's own syslog-shaped lead-in, and a HELO in parentheses
    - message: '2016-04-01 11:08:00 info exim[8001]: [8001] no MAIL in SMTP connection from (User) [192.0.2.29]:20042 I=[192.0.2.1]:25 Ci=8001 D=0.349s C=EHLO,AUTH,QUIT'
      found: 1
      data:
        SRC: "192.0.2.29"
    - message: '2016-03-18 00:34:06 [7513] SMTP protocol error in "AUTH LOGIN" H=(ylmf-pc) [192.0.2.167]:60723 I=[192.0.2.6]:587 AUTH command used when not advertised'
      found: 1
      data:
        SRC: "192.0.2.167"
    # a HELO holding a bracketed address of its own
    - message: '2016-03-19 18:40:44 [26221] SMTP protocol error in "AUTH LOGIN aW5mb0BtYW5iYXQub3Jn" H=([127.0.0.1]) [192.0.2.170]:14243 I=[192.0.2.6]:587 AUTH command used when not advertised'
      found: 1
      data:
        SRC: "192.0.2.170"
    - message: '2016-04-01 11:08:00 info exim[8003]: [8003] SMTP protocol error in "AUTH LOGIN" H=(User) [192.0.2.29]:4816 I=[192.0.2.1]:25 Ci=8003 LOGIN authentication mechanism not supported'
      found: 1
      data:
        SRC: "192.0.2.29"
    - message: '2016-03-21 04:07:49 [25874] 1ahr79-0006jK-G9 SMTP connection from (voyeur.example.com) [192.0.2.204]:44884 I=[192.0.2.6]:25 closed by DROP in ACL'
      found: 1
      data:
        SRC: "192.0.2.204"
    - message: '2016-03-21 04:33:14 SMTP connection from (some.domain) [192.0.2.33] closed by DROP in ACL'
      found: 1
      data:
        SRC: "192.0.2.33"
    - message: '2013-06-02 09:22:07 SMTP call from [192.0.2.109] dropped: too many unrecognized commands (last was "\033%-12345X")'
      found: 1
      data:
        SRC: "192.0.2.109"
    # the syntax drop raw/exim does not read, a ", C=" after the command
    - message: '2013-06-02 09:22:08 SMTP call from xxx.example.com [192.0.2.110] dropped: too many syntax or protocol errors (last command was "\300\024?\234?\235?/?5\300\022?",  C=EHLO)'
      found: 1
      data:
        SRC: "192.0.2.110"
    - message: '2017-05-01 07:42:42 H=some.rev.dns.example (the.connector.example) [192.0.2.3] F=<some.name@example.com> rejected RCPT <x@example.org>: Recipient verify failed'
      found: 1
      data:
        SRC: "192.0.2.3"
    - message: '2017-12-03 08:32:00 no host name found for IP address 192.0.2.8'
      found: 1
      data:
        SRC: "192.0.2.8"
    - message: '2017-12-03 08:51:35 no IP address found for host test.example.com (during SMTP connection from [192.0.2.9])'
      found: 1
      data:
        SRC: "192.0.2.9"
    - message: '2022-04-03 21:53:53 no IP address found for host hos-t.example.tld (during SMTP connection from [192.0.2.123]:49390 I=[192.0.2.17]:25)'
      found: 1
      data:
        SRC: "192.0.2.123"
    - message: '2022-04-03 21:53:54 H=[192.0.2.101]:62839 dropped by ''connect'' ACL: Country is banned'
      found: 1
      data:
        SRC: "192.0.2.101"
    # a syslog "<host> exim[<pid>]:" ahead of exim's timestamp
    - message: 'mail.example.com exim[3751844]: 2021-07-17 23:20:51 [8004] no MAIL in SMTP connection from (User) [192.0.2.30]:20043 I=[192.0.2.1]:25 D=1s'
      found: 1
      data:
        SRC: "192.0.2.30"
    - message: 'mail.example.com exim[3751845]: 2021-07-17 23:20:52 SMTP protocol error in "AUTH LOGIN" H=(User) [192.0.2.31] AUTH command used when not advertised'
      found: 1
      data:
        SRC: "192.0.2.31"
  negative:
    # raw/exim's, so not this rule's... the two never take the same line
    - message: '2013-06-10 18:33:32 [10099] H=(yakult.example.tw) [192.0.2.178]:3755 I=[192.0.2.4]:25 F=a@example.org rejected RCPT b@example.ru: relay not permitted'
      found: 0
      undefed: ["SRC"]
    - message: '2013-06-02 09:22:06 SMTP call from [192.0.2.111] dropped: too many syntax or protocol errors (last command was "AUTH LOGIN")'
      found: 0
      undefed: ["SRC"]
    - message: '2013-01-04 17:03:46 login authenticator failed for (example) [192.0.2.112]: 535 Incorrect authentication data'
      found: 0
      undefed: ["SRC"]
    # an ordinary delivery
    - message: '2013-06-02 09:22:06 [19592] 1UhErCG-000657-Vd <= neti@example.com H=mail.example.com [192.0.2.44] P=esmtp S=2938'
      found: 0
      undefed: ["SRC"]
  injection:
    # the command the client sent forging an H=(...) [<addr>] ahead of exim's
    - message: '2017-11-28 14:14:32 SMTP protocol error in "aUtH lOgIn" H=(test) [198.51.100.8]" H=(roxzgj) [192.0.2.6] AUTH command used when not advertised'
      data:
        SRC: "192.0.2.6"
