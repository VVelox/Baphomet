---
# The FortiGate's own filesystem betraying a tampering hand... the
# real-time integrity checker of FortiOS 7.4 crying out. FortiOS speaks
# syslog natively in key=value, so this raw rule anchors on the logid,
# never the line's head, and counts by the device that cried. Folded
# from sagan-rules fortinet.rules, the LOG_ID_SYS_SECURITY quartet:
# filesystem write violation (20230), attempt to replace a symlink
# (20231), non-kernel module loading (20232), and file hash mismatch
# (20234). Any one of these on a firewall is the device itself
# compromised, so one sighting is a verdict. Detection-only... the
# offender is inside the box, and there is no address to banish.
rev: 1
msg: "[FORTINET] filesystem integrity violation"
severity: critical
classtype: malware
references:
  - https://docs.fortinet.com/document/fortigate/7.4.0/new-features/226732/real-time-file-system-integrity-checking
  - https://fortinetweb.s3.amazonaws.com/docs.fortinet.com/v2/attachments/b43f86b1-9e63-11ed-8e6d-fa163e15d75b/FortiOS_7.2.4_Log_Reference.pdf
message_regexp:
  - 'devname="?(?<DEV>[^" ]+)"?.*?logid="\d*2023[0124]" type="event" subtype="system"'
detection_var:
  - DEV
max_score: 1
tests:
  positive:
    - message: 'Jul 12 15:37:00 fw01 date=2026-07-12 time=15:37:00 devname="FGT200F" devid="FG200FT000000001" logid="0100020230" type="event" subtype="system" level="alert" vd="root" eventtime=1752352620000000000 tz="-0500" logdesc="System file integrity monitor" action="write-violation" filename="/bin/init" msg="File system integrity check detected a write violation on /bin/init"'
      found: 1
      data:
        DEV: "FGT200F"
    - message: 'Jul 12 15:39:12 fw01 date=2026-07-12 time=15:39:12 devname="FGT200F" devid="FG200FT000000001" logid="0100020234" type="event" subtype="system" level="alert" vd="root" eventtime=1752352752000000000 tz="-0500" logdesc="System file integrity monitor" action="hash-mismatch" filename="/bin/sshd" msg="File system integrity check found a file hash mismatch for /bin/sshd"'
      found: 1
      data:
        DEV: "FGT200F"
  negative:
    - message: 'Jul 12 15:45:00 fw01 date=2026-07-12 time=15:45:00 devname="FGT200F" devid="FG200FT000000001" logid="0100022700" type="event" subtype="system" level="critical" vd="root" eventtime=1752353100000000000 tz="-0500" logdesc="IPS session scan paused" action="scan-pause" reason="cpu-limit" msg="IPS session scan paused due to CPU usage limit"'
      found: 0
      undefed: ["DEV"]
    - message: 'Jul 12 15:46:30 fw01 date=2026-07-12 time=15:46:30 devname="FGT200F" devid="FG200FT000000001" logid="0100020233" type="event" subtype="system" level="information" vd="root" eventtime=1752353190000000000 tz="-0500" logdesc="System file integrity monitor" action="scan-complete" msg="File system integrity scan completed"'
      found: 0
      undefed: ["DEV"]
