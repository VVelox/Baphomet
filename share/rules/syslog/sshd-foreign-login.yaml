---
# A successful ssh login from outside your home countries... the traveling
# employee or the compromised account, and the rule can not tell which, so
# it sights rather than banishes. Detection-only (detection_var)... flip it
# to ban_var only if a foreign login is grounds for a ban at your site,
# knowingly, since the source just got in.
#
# The country gate is your policy, not the rule's... it imports the named
# list country_codes{home}, which you define in the config (see
# configuration.md, country_codes, and rules.md, the country gate). Ship
# nothing and the rule refuses to load, loudly... it is opt-in by both
# listing it in a watcher and naming your home countries. Needs geoip_db
# and IP::Geolocation::MMDB behind the gate.
#
# The gate is the vars form, keyed by the captured SRC, so it is data-
# driven and provable from this file's own geo fixtures. It fails closed:
# an address the database can not place does not count, so a database gap
# never raises a false alarm... it only misses. List it beside syslog/sshd
# and the breach/worked readers; a domestic login is vetoed here and falls
# through untouched.
rev: 1
msg: "[SSHD] login success from outside the home countries"
severity: high
classtype: suspicious-login
daemons:
  - sshd
  - sshd-session
message_regexp:
  - '^Accepted \S+ for (?<USER>\S+) from %%%%SRC%%%%'
country:
  isnot:
    - "%%%country_codes{home}%%%"
  vars:
    - SRC
detection_var:
  - SRC
max_score: 1
tests:
  positive:
    # a login from abroad... the isnot gate lets it count
    - message: "Jul 12 08:25:49 vixen42 sshd-session[36748]: Accepted publickey for kitsune from 203.0.113.9 port 21680 ssh2: ED25519 SHA256:hjUf"
      geo:
        countries:
          "203.0.113.9": NL
        lists:
          home: [ US ]
      found: 1
      data:
        SRC: "203.0.113.9"
        USER: "kitsune"
    - message: "Jul 12 08:25:49 vixen42 sshd[2278]: Accepted password for root from 198.51.100.23 port 4711 ssh2"
      geo:
        countries:
          "198.51.100.23": DE
        lists:
          home: [ US, CA ]
      found: 1
      data:
        SRC: "198.51.100.23"
        USER: "root"
  negative:
    # a login from home... the gate vetoes, and the line falls through
    - message: "Jul 12 08:25:49 vixen42 sshd[2278]: Accepted password for root from 198.51.100.5 port 4711 ssh2"
      geo:
        countries:
          "198.51.100.5": US
        lists:
          home: [ US ]
      found: 0
    # a failure is not this rule's business... syslog/sshd owns that
    - message: "Jul 12 08:15:50 vixen42 sshd[2278]: Failed password for invalid user admin from 203.0.113.9 port 4711 ssh2"
      found: 0
      undefed: ["SRC"]
    # an unplaceable address fails closed... no false alarm on a database gap
    - message: "Jul 12 08:25:49 vixen42 sshd[2278]: Accepted password for root from 192.0.2.66 port 4711 ssh2"
      geo:
        countries:
          "192.0.2.66": unknown
        lists:
          home: [ US ]
      found: 0
