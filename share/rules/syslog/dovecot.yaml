---
# Matches dovecot auth failures. Based on the fail2ban dovecot filter in
# its normal mode, translated to Baphomet and simplified... the aggressive
# mode no-auth-attempt matching is dropped.
rev: 6
msg: "[DOVECOT] authentication failure"
severity: high
classtype: brute-force
mark:
  - name: brute_force
    ttl: 21600
daemons:
  - dovecot
  - dovecot-auth
  - //^dovecot//
  - //^auth(?:-worker)?\b//
mungers:
  - dovecot
message_regexp:
  # The account name reaches the address. user=<...> is bounded by ">", so an
  # account holding one closes the field early and whatever follows in the
  # name is read as further fields... an account of
  # "a>, rip=8.8.8.8, lip=9.9.9.9" plants a whole rip/lip pair ahead of the
  # real one, so neither lazy matching nor a lip= anchor can tell them apart.
  # Nothing dovecot writes after the real pair comes from the client, so the
  # wildcard is greedy and the last rip= is the one taken.
  #
  # The field run after "):" is a wildcard rather than a spelled-out
  # user=/method= sequence so that a corrupted name costs the match nothing:
  # spelled out, a planted field broke the sequence and the line stopped
  # matching at all, which let the attacker go uncounted instead of merely
  # misaimed. Greedy steps over the forgery and still finds the real pair.
  #
  # pam(), sql() and the other passdb drivers name the account and then the
  # address, comma separated, and an account may hold a comma... "x,8.8.8.8"
  # plants an address ahead of the real one. Greedy takes the last there too.
  - '^(?:pop3|imap|managesieve|submission)-login: (?:Info: )?(?:Login aborted|Aborted login|Disconnected|Remote closed connection|Client has quit the connection).*?\((?:auth failed, \d+ attempts(?: in \d+ secs)?|tried to use dis(?:abled|allowed) \S+ auth|proxy dest auth failed)\)(?: \([a-z_]+\))?:.* rip=%%%%SRC%%%%(?:, lip=|\s*$)'
  - '^(?:pam_[a-z0-9_]+(?:\(dovecot:auth\))?: )?authentication failure; logname=\S* uid=\S* euid=\S* tty=dovecot ruser=(?:\S*|.*?) rhost=%%%%SRC%%%%(?:\s+user=(?:\S*| +(?!rhost=))*)?\s*$'
  - '^(?:dovecot: )?(?:auth(?:-worker)?(?:\([^\)]*\))?: )?(?:Info: )?(?:conn \S+:auth(?:-worker)? \([^\)]+\): auth(?:-worker)?<\d+>: )?pam\(\S*,%%%%SRC%%%%(?:,\S*)?\): pam_authenticate\(\) failed: (?:User not known to the underlying authentication module: \d+ Time\(s\)|Authentication failure \([Pp]assword mismatch\?\)|Permission denied)'
  - '^(?:dovecot: )?(?:auth(?:-worker)?(?:\([^\)]*\))?: )?(?:Info: )?(?:conn \S+:auth(?:-worker)? \([^\)]+\): auth(?:-worker)?<\d+>: )?[a-z\-]{3,15}\(\S*,%%%%SRC%%%%(?:,\S*)?\): (?:[Uu]nknown user|[Ii]nvalid credentials|[Pp]assword mismatch)'
  # auth-worker naming the account and address in its own prefix, with the
  # driver after... "auth-worker(user,ip)<pid><session>: request [N]: pam:" and
  # the Dovecot 2.4 "auth(user,ip,mech)<session>: Info: sql:"
  - '^(?:dovecot: )?auth(?:-worker)?\(\S*,%%%%SRC%%%%(?:,\S*)?\)(?:<[^>]+>){0,2}: (?:request \[\d+\]: )?(?:Info: )?(?:[a-z\-]+: )?(?:\w+_authenticate\(\) failed: (?:User not known to the underlying authentication module: \d+ Time\(s\)|Authentication failure \([Pp]assword mismatch\?\)|Permission denied)|[Uu]nknown user|[Ii]nvalid credentials|[Pp]assword mismatch)'
src_ip_var: SRC
dest_ip_var: dovecot_lip
user_var: dovecot_user
ban_var:
  - SRC
tests:
  positive:
    - message: "Dec 12 11:19:11 dunnart dovecot: pop3-login: Aborted login (tried to use disabled plaintext auth): rip=190.210.136.21, lip=113.212.99.193"
      found: 1
      data:
        SRC: "190.210.136.21"
    - message: "Jun 13 16:30:54 platypus dovecot: imap-login: Disconnected (auth failed, 2 attempts): user=<username.bob>, method=PLAIN, rip=49.176.98.87, lip=113.212.99.194, TLS"
      found: 1
      data:
        SRC: "49.176.98.87"
    - message: "Jun 23 00:52:43 vhost1-ua dovecot: pop3-login: Disconnected: Inactivity (auth failed, 1 attempts): user=<info>, method=PLAIN, rip=193.95.245.163, lip=176.214.13.210"
      found: 1
      data:
        SRC: "193.95.245.163"
    - message: "Jul 02 13:49:31 hostname dovecot[442]: pop3-login: Aborted login (auth failed, 1 attempts in 17 secs): user=<test>, method=PLAIN, rip=192.51.100.13, lip=203.0.113.17, session=<YADINsQCDs5BH8Pg>"
      found: 1
      data:
        SRC: "192.51.100.13"
    - message: "Jul 12 08:15:50 vixen42 dovecot-auth: pam_unix(dovecot:auth): authentication failure; logname= uid=0 euid=0 tty=dovecot ruser=web rhost=176.61.140.224"
      found: 1
      data:
        SRC: "176.61.140.224"
    # a rhost injected into ruser must not be what gets captured
    - message: "Jul 12 08:15:50 vixen42 dovecot-auth: pam_unix(dovecot:auth): authentication failure; logname= uid=0 euid=0 tty=dovecot ruser=rhost=1.2.3.4 rhost=192.0.43.10"
      found: 1
      data:
        SRC: "192.0.43.10"
    - message: "Jan 29 05:32:50 mail dovecot: auth-worker(304): pam(username,1.2.3.4): pam_authenticate() failed: Authentication failure (password mismatch?)"
      found: 1
      data:
        SRC: "1.2.3.4"
    - message: "Jan 29 18:55:55 mail dovecot: auth-worker(12182): pam(user,192.0.2.4): pam_authenticate() failed: Authentication failure (Password mismatch?)"
      found: 1
      data:
        SRC: "192.0.2.4"
    - message: "Jul 02 13:49:32 hostname dovecot[442]: dovecot: auth(default): pam(account@MYSERVERNAME.com,200.76.17.206): pam_authenticate() failed: User not known to the underlying authentication module: 2 Time(s)"
      found: 1
      data:
        SRC: "200.76.17.206"
    - message: "Jan 29 05:13:50 mail dovecot: auth: passwd-file(username,1.2.3.4): unknown user"
      found: 1
      data:
        SRC: "1.2.3.4"
    - message: "Jan 29 13:54:06 auth-worker(22401): Info: sql(admin@example.de,192.0.2.5,<n4JLdHNVngZGpV2j>): unknown user"
      found: 1
      data:
        SRC: "192.0.2.5"
    - message: "Jun 11 13:57:17 main dovecot: auth: sql(admin@example.ru,192.168.144.226,<6rXunFtu493AqJDi>): Password mismatch"
      found: 1
      data:
        SRC: "192.168.144.226"
    - message: "Jun 12 11:48:12 auth-worker(80180): Info: conn unix:auth-worker (uid=143): auth-worker<13247>: sql(support,192.0.2.6): unknown user"
      found: 1
      data:
        SRC: "192.0.2.6"
    # dovecot 2.3.21+ login abort, the reason code after the reason
    - message: "Aug 30 09:51:49 host dovecot[2623853]: imap-login: Login aborted: Inactivity (auth failed, 3 attempts in 177 secs) (auth_failed): user=<eric>, method=PLAIN, rip=192.0.2.50, lip=193.24.208.184, TLS, session=<SESSION2>"
      found: 1
      data:
        SRC: "192.0.2.50"
    - message: "Jun 13 16:35:56 mx dovecot[241]: managesieve-login: Login aborted: Logged out (auth failed, 1 attempts in 10 secs) (auth_failed): user=<user@domain>, method=PLAIN, rip=192.0.2.241, lip=203.0.113.104, TLS, session=<Dp8j1Ho3suQYdo+k>"
      found: 1
      data:
        SRC: "192.0.2.241"
    # the auth-worker naming account and address in its own prefix
    - message: "Aug 30 09:48:53 host dovecot[2623853]: auth-worker(eric,192.0.2.51)<566595><SESSION2>: request [3]: pam: pam_authenticate() failed: Authentication failure (Password mismatch?)"
      found: 1
      data:
        SRC: "192.0.2.51"
    - message: "Aug 30 08:42:47 host dovecot[2623853]: auth-worker(eric,192.0.2.60)<3499329>: request [1]: pam: pam_authenticate() failed: Authentication failure (Password mismatch?)"
      found: 1
      data:
        SRC: "192.0.2.60"
    # dovecot 2.4
    - message: "Aug 30 00:10:57 host dovecot: auth(info@example.com,192.0.2.110,sasl:login)<CvN+E95Uf4e7eEnj>: Info: sql: Password mismatch (given password: XxxxXXxx123)"
      found: 1
      data:
        SRC: "192.0.2.110"
  negative:
    # no auth attempts is the aggressive mode's business, not ours
    - message: "Jun 13 20:48:11 platypus dovecot: pop3-login: Disconnected (no auth attempts): rip=121.44.24.254, lip=113.212.99.194, TLS: Disconnected"
      found: 0
      undefed: ["SRC"]
    - message: "Jun 13 21:48:06 platypus dovecot: pop3-login: Disconnected: Inactivity (no auth attempts): rip=180.200.180.81, lip=113.212.99.194, TLS"
      found: 0
      undefed: ["SRC"]
    - message: "Jun 13 21:48:07 platypus dovecot: imap-login: Login: user=<kitsune>, method=PLAIN, rip=192.0.2.99, lip=113.212.99.194, TLS"
      found: 0
      undefed: ["SRC"]
  injection:
    # An account name holding a ">" closes user=<...> early, so the rest of the
    # name is read as further fields... here it plants a rip= ahead of the real
    # one. The lip= anchor steps over it, and the attacker is still counted.
    - message: "Jun 13 16:30:54 mail01 dovecot: imap-login: Disconnected (auth failed, 2 attempts): user=<a>, rip=8.8.8.8, method=X>, method=PLAIN, rip=49.176.98.87, lip=10.0.0.1, TLS"
      data:
        SRC: "49.176.98.87"
    # the whole rip/lip pair forged... the last pair is dovecot's own
    - message: "Jun 13 16:30:54 mail01 dovecot: imap-login: Disconnected (auth failed, 2 attempts): user=<a>, rip=8.8.8.8, lip=9.9.9.9>, method=PLAIN, rip=49.176.98.87, lip=10.0.0.1, TLS"
      data:
        SRC: "49.176.98.87"
    # an account holding a comma plants an address in the passdb argument list
    - message: "Jan 29 18:55:55 mail01 dovecot: auth-worker(12182): pam(x,8.8.8.8,192.0.2.4): pam_authenticate() failed: Authentication failure (Password mismatch?)"
      data:
        SRC: "192.0.2.4"
    - message: "Jan 29 05:13:50 mail01 dovecot: auth: passwd-file(x,8.8.8.8,192.0.2.4): unknown user"
      data:
        SRC: "192.0.2.4"
    - message: "Jun 11 13:57:17 mail01 dovecot: auth: sql(x,8.8.8.8,192.0.2.5,<6rXunFtu493AqJDi>): Password mismatch"
      data:
        SRC: "192.0.2.5"
    - message: "Aug 30 09:48:53 mail01 dovecot[2623853]: auth-worker(x,8.8.8.8,192.0.2.51)<566595><SESSION2>: request [3]: pam: pam_authenticate() failed: Authentication failure (Password mismatch?)"
      data:
        SRC: "192.0.2.51"
    # a forged rhost= in ruser (fail2ban 789571aa)
    - message: "Jul 12 08:15:50 mail01 dovecot-auth: pam_unix(dovecot:auth): authentication failure; logname= uid=0 euid=0 tty=dovecot ruser=a rhost=8.8.8.8 rhost=192.0.43.11"
      data:
        SRC: "192.0.43.11"
