---
# Matches postfix smtpd SASL auth failures. Based on the auth mode of the
# fail2ban postfix filter, translated to Baphomet and simplified. Pairs
# with syslog/postfix, which handles the rejects... a maillog watcher
# usually wants both, via a rule array.
rev: 5
msg: "[POSTFIX] SASL authentication failure"
severity: high
classtype: brute-force
mark:
  - name: brute_force
    ttl: 21600
daemons:
  - //^postfix(?:-[\w.-]+)?\/\w+(?:\/smtp[ds])?$//
mungers:
  - postfix
message_regexp:
  # The account is captured here rather than taken from the postfix munger...
  # the munger names postfix_sasl_username only on the client=..., sasl_username=
  # lines of a login that worked, never on this warning. Postfix 3.8 and later
  # append `, sasl_username=<account>` to the failure, and older ones log no
  # account at all, so the capture is optional and USER is simply absent there.
  # It sits after the address and is anchored on the end of the line, so the
  # account a client chose can name itself but can not move the offender.
  - '^warning: [^\[]*\[%%%%SRC%%%%\](?::\d+)?: SASL (?i:LOGIN|PLAIN|(?:CRAM|DIGEST)-MD5) authentication failed:(?! Connection lost to authentication server| Invalid authentication mechanism)(?:.*, sasl_username=(?<USER>\S+)\s*$)?'
src_ip_var: SRC
user_var: USER
ban_var:
  - SRC
tests:
  positive:
    - message: "Dec  2 22:24:22 hel postfix/smtpd[7676]: warning: 114-44-142-233.dynamic.hinet.net[114.44.142.233]: SASL CRAM-MD5 authentication failed: PDc3OTEwNTkyNTEyMzA2NDIuMTIyODI1MzA2MUBoZWw+"
      found: 1
      data:
        SRC: "114.44.142.233"
    - message: "Mar 10 13:33:30 gandalf postfix/smtpd[3937]: warning: HOSTNAME[1.1.1.1]: SASL LOGIN authentication failed: authentication failure"
      found: 1
      data:
        SRC: "1.1.1.1"
    - message: "Sep  6 00:44:56 trianon postfix/submission/smtpd[11538]: warning: unknown[82.221.106.233]: SASL LOGIN authentication failed: UGFzc3dvcmQ6"
      found: 1
      data:
        SRC: "82.221.106.233"
    - message: "Sep  6 00:44:57 trianon postfix/submission/smtpd[11538]: warning: unknown[82.221.106.233]: SASL login authentication failed: UGFzc3dvcmQ6"
      found: 1
      data:
        SRC: "82.221.106.233"
    - message: "Jan 29 08:11:45 mail postfix-incoming/smtpd[10752]: warning: unknown[1.1.1.1]: SASL LOGIN authentication failed: Password:"
      found: 1
      data:
        SRC: "1.1.1.1"
    # a multi-instance name holding a hyphen (fail2ban 839fb632)
    - message: "Aug 14 10:00:02 mail postfix-mta-in/smtpd[1235]: warning: unknown[192.0.2.40]: SASL LOGIN authentication failed: UGFzc3dvcmQ6"
      found: 1
      data:
        SRC: "192.0.2.40"
    # Postfix 3.8 and later name the account on the failure
    - message: "Jul 12 08:15:50 mail01 postfix/smtpd[3937]: warning: unknown[192.0.2.40]: SASL LOGIN authentication failed: UGFzc3dvcmQ6, sasl_username=neti@example.com"
      found: 1
      data:
        SRC: "192.0.2.40"
        USER: "neti@example.com"
  injection:
    # the account is client chosen, so one shaped like the head of the line
    # tries to plant a second address... it is behind the real one and inside
    # the account capture, so the offender stays the offender
    - message: "Jul 12 08:15:50 mail01 postfix/smtpd[3937]: warning: unknown[192.0.2.40]: SASL LOGIN authentication failed: UGFzc3dvcmQ6, sasl_username=unknown[203.0.113.222]:"
      data:
        SRC: "192.0.2.40"
        USER: "unknown[203.0.113.222]:"
  negative:
    - message: "Feb  3 08:29:28 mail postfix/smtpd[21022]: warning: unknown[1.1.1.1]: SASL LOGIN authentication failed: Connection lost to authentication server"
      found: 0
      undefed: ["SRC"]
    - message: "Jan 14 16:18:16 xxx postfix/smtpd[14933]: warning: host[192.0.2.5]: SASL CRAM-MD5 authentication failed: Invalid authentication mechanism"
      found: 0
      undefed: ["SRC"]
    - message: "Jan 14 16:18:17 xxx postfix/smtpd[14933]: connect from mail.example.com[192.0.2.6]"
      found: 0
      undefed: ["SRC"]
