---
# Brands each sshd auth failure with the account it targeted, keyed by the
# username and storing the source address that hit it. Sets nothing loose
# on its own... mark_only means it only brands and never counts toward a
# ban, and does not consume the line, so matching falls through to the
# spray rule and the plain sshd rule after it. Pair it with
# syslog/sshd-spray, which reads these marks. List sshd-spray BEFORE this
# in the watcher so the gate sees the source that established the account,
# not the one this line would re-brand it with.
rev: 5
msg: "[SSHD] brand account with source"
severity: info
classtype: not-suspicious
daemons:
  - sshd
  - sshd-session
mungers:
  - sshd
message_regexp:
  - '^(?:(?:error|fatal): (?:PAM: )?)?[iI](?:llegal|nvalid) user (?<USER>\S+) from %%%%SRC%%%%'
  - '^(?:(?:error|fatal): (?:PAM: )?)?Failed \S+ for (?:invalid user )?(?<USER>\S+) from %%%%SRC%%%%'
  - '^(?:(?:error|fatal): (?:PAM: )?)?[aA]uthentication (?:failure|error|failed) for (?<USER>\S+) from %%%%SRC%%%%'
  - '^(?:(?:error|fatal): (?:PAM: )?)?maximum authentication attempts exceeded for (?<USER>\S+) from %%%%SRC%%%%'
ban_var:
  - SRC
mark_only: true
mark:
  - name: sshd-account-src
    ttl: 3600
    var: USER
    value_var: SRC
tests:
  positive:
    # and the brand lands keyed by the account, carrying the source
    - message: "Jul 12 08:15:50 vixen42 sshd-session[66891]: Invalid user moth3r from 216.137.179.214 port 34640"
      found: 1
      data:
        USER: "moth3r"
        SRC: "216.137.179.214"
      marks_expected:
        - name: sshd-account-src
          key: moth3r
          value: "216.137.179.214"
    - message: "Jul 12 08:15:50 vixen42 sshd[2278]: Failed password for invalid user admin from 192.0.2.7 port 4711 ssh2"
      found: 1
      data:
        USER: "admin"
        SRC: "192.0.2.7"
      marks_expected:
        - name: sshd-account-src
          key: admin
          value: "192.0.2.7"
    - message: "Jul 12 08:15:50 vixen42 sshd-session[2279]: Failed password for root from 2001:db8::badc:0ffe port 62022 ssh2"
      found: 1
      data:
        USER: "root"
        SRC: "2001:db8::badc:0ffe"
    - message: "Jul 12 08:15:50 vixen42 sshd[1094]: error: PAM: Authentication failure for root from 192.0.2.11"
      found: 1
      data:
        USER: "root"
        SRC: "192.0.2.11"
    # the max-attempts shape, which no test reached
    - message: "Jul 12 08:15:51 mail01 sshd[21810]: error: maximum authentication attempts exceeded for root from 203.0.113.42 port 49940 ssh2 [preauth]"
      found: 1
      data:
        USER: "root"
        SRC: "203.0.113.42"
      marks_expected:
        - name: sshd-account-src
          key: root
          value: "203.0.113.42"
    # A SEQUENCE, because the property that matters here is not what one line
    # brands but what the SECOND line does to it. The brand carries the source
    # that last hit the account, so a second source RE-BRANDS rather than being
    # ignored... which is the whole reason syslog/sshd-spray must be listed
    # AHEAD of this rule. Read after branding, its value_not gate would compare
    # the account's source against the very line that had just re-branded it and
    # so never fire. marks_after asserts at each step rather than only at the
    # end, so both halves are visible.
    - messages:
        - message: "Jul 12 08:15:50 host01 sshd[1]: Invalid user moth3r from 198.51.100.9 port 1"
          found_after: 1
          marks_after:
            - name: sshd-account-src
              key: moth3r
              value: "198.51.100.9"
        - message: "Jul 12 08:15:51 host01 sshd[2]: Invalid user moth3r from 203.0.113.7 port 2"
          found_after: 2
          marks_after:
            - name: sshd-account-src
              key: moth3r
              value: "203.0.113.7"
      found: 2
    # and the brands are keyed by the ACCOUNT, so two accounts hit from one
    # source are two brands and not one overwritten
    - messages:
        - message: "Jul 12 08:16:00 host01 sshd[3]: Invalid user alice from 198.51.100.10 port 1"
          found_after: 1
        - message: "Jul 12 08:16:01 host01 sshd[4]: Invalid user bob from 198.51.100.10 port 2"
          found_after: 2
          marks_after:
            - name: sshd-account-src
              key: alice
              value: "198.51.100.10"
            - name: sshd-account-src
              key: bob
              value: "198.51.100.10"
      found: 2
  negative:
    - message: "Jul 12 08:25:49 vixen42 sshd-session[36748]: Accepted publickey for kitsune from 127.0.0.1 port 21680 ssh2: ED25519 SHA256:hjUf"
      found: 0
      undefed: ["SRC", "USER"]
