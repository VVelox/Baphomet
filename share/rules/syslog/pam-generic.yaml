---
# Matches PAM authentication failures logged by any daemon. Based on the
# fail2ban pam-generic filter, translated to Baphomet.
#
# The rhost of a PAM failure is not always a IP... some services hand PAM a
# hostname, so this uses the HOST token and ban_var and whatever matched is
# what gets sent to Ereshkigal.
#
# The pam munger names the service the stack was running under, the account
# the failure was about, and the tty... all of which this rule steps over on
# its way to the rhost. It reads the modern pam_unix(service:type) phrasing
# only, so the older `(pam_unix)` and bare `pam_unix:` forms the regexp still
# matches arrive with the offender alone.
rev: 4
msg: "[PAM] authentication failure"
severity: high
classtype: brute-force
mark:
  - name: brute_force
    ttl: 21600
daemons:
  - //.//
mungers:
  - pam
message_regexp:
  - '^\(?pam_[a-z0-9_]+(?:\(\S+\))?\)?:? authentication failure;(?:\s*(?:logname|e?uid|tty)=\S*){0,4}\s+ruser=(?:\S*|.*?) rhost=%%%%HOST%%%%(?:\s+user=(?:\S*| +(?!rhost=))*)?\s*$'
user_var: pam_user
ban_var:
  - HOST
tests:
  positive:
    - message: "Feb  7 15:10:42 example pure-ftpd: (pam_unix) authentication failure; logname= uid=0 euid=0 tty=pure-ftpd ruser=sample-user rhost=192.168.1.1 "
      found: 1
      data:
        HOST: "192.168.1.1"
    - message: "May 12 09:47:54 vaio sshd[16004]: (pam_unix) authentication failure; logname= uid=0 euid=0 tty=ssh ruser= rhost=71-13-115-12.static.mdsn.wi.charter.com  user=root"
      found: 1
      data:
        HOST: "71-13-115-12.static.mdsn.wi.charter.com"
    - message: "Jul 19 18:11:26 srv2 vsftpd: pam_unix(vsftpd:auth): authentication failure; logname= uid=0 euid=0 tty=ftp ruser=an8767 rhost=www.google.com"
      found: 1
      data:
        HOST: "www.google.com"
    - message: "Jul 19 18:11:26 srv2 vsftpd: pam_unix: authentication failure; logname= uid=0 euid=0 tty=ftp ruser=an8767 rhost=www.google.com"
      found: 1
      data:
        HOST: "www.google.com"
    # an account with a space in it, as ruser
    - message: "Jul 19 18:11:30 srv2 vsftpd: pam_unix(vsftpd:auth): authentication failure; logname= uid=0 euid=0 tty=ftp ruser=a b rhost=192.0.2.9"
      found: 1
      data:
        HOST: "192.0.2.9"
  negative:
    # pam in the daemon position rather than leading the message
    - message: "Nov 25 17:12:13 webmail pop(pam_unix)[4920]: authentication failure; logname= uid=0 euid=0 tty= ruser= rhost=192.168.10.3 user=mailuser"
      found: 0
      undefed: ["HOST"]
    - message: "Jul 19 18:11:27 srv2 vsftpd: pam_unix(vsftpd:auth): session opened for user kitsune by (uid=0)"
      found: 0
      undefed: ["HOST"]
  injection:
    # A forged rhost= in ruser, which pam writes ahead of the real one, and in
    # user= after it. Following fail2ban (789571aa), user= may not hold
    # " rhost=" and ruser may hold anything, so a forgery on both sides is
    # read as ruser's... pam_unix names user= only for an account that exists,
    # so it is not the client's to write.
    - message: "Jul 19 18:11:50 srv2 daemon: pam_unix(auth): authentication failure; logname= uid=0 euid=0 tty=xxx ruser=test rhost=192.0.2.100 rhost=192.0.2.200"
      data:
        HOST: "192.0.2.200"
    - message: "Jul 19 18:11:52 srv2 daemon: pam_unix(auth): authentication failure; logname= uid=0 euid=0 tty=xxx ruser= rhost=192.0.2.101 user=test rhost=192.0.2.201"
      data:
        HOST: "192.0.2.201"
    - message: "Jul 19 18:11:54 host auth[4242]: pam_unix(someservice:auth): authentication failure; logname= uid=0 euid=0 tty=someservice ruser=a rhost=192.0.2.102 user=a rhost=192.0.2.103 user=a rhost=192.0.2.202 user="
      data:
        HOST: "192.0.2.202"
    - message: "Jul 19 18:11:54 host auth[4242]: pam_unix(someservice:auth): authentication failure; logname= uid=0 euid=0 tty=someservice ruser=a rhost=192.0.2.102 user=a rhost=192.0.2.103 user=a rhost=192.0.2.202"
      data:
        HOST: "192.0.2.202"
