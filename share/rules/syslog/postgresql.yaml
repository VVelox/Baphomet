---
# Matches PostgreSQL password authentication failures. No fail2ban filter
# exists for this, so it is modelled on Sagan's postgresql.rules and
# PostgreSQL's own output. Requires postgres to log through syslog
# (`log_destination = syslog`) AND `log_line_prefix` to include `%h` (with
# `log_connections = on`) so the client address rides on the failure line...
# without `%h` there is no offender on the line and nothing to banish. Two
# patterns because `%h` renders differently by position: the `%q...host=`
# idiom (`host=1.2.3.4`) versus a bare address field just before FATAL.
#
# The postgresql munger names the account the password was tried against. Its
# own PROGRAM gate is narrower than the daemons regexp above, matching only
# `postgres` and `postgresql`, so a per-cluster syslog_ident such as
# `postgres-16` still matches the rule but arrives without the account.
rev: 5
msg: "[POSTGRESQL] password authentication failure"
severity: high
classtype: brute-force
mark:
  - name: brute_force
    ttl: 21600
daemons:
  # syslog_ident is a postgresql.conf setting, defaulting to `postgres` but
  # routinely set per cluster... so a regexp rather than the bare default, which
  # would have missed `postgresql` and `postgres-16` in silence
  - //^postgres(?:ql)?(?:[-_]\w+)?$//
mungers:
  - postgresql
message_regexp:
  # The account name is whatever the client sent, spaces and all, and it is
  # on the line up to twice... in the prefix when log_line_prefix holds %u,
  # and always in the quoted tail. A name such as `x host=203.0.113.222 y`
  # therefore plants a second host=, and one holding the failure text itself
  # plants a second copy of that. Nothing in the line says which copy
  # PostgreSQL wrote, so the two leading lookaheads refuse to guess: a line
  # with two host= is not taken by the host= pattern, and a line holding the
  # failure text twice is taken by neither. A doubled host= still falls to the
  # second pattern, which lands on the address sitting directly ahead of the
  # one real FATAL. A doubled failure text matches nothing at all, which is
  # the safe way to fail... no account has such a name, so nothing guessable
  # is being let through.
  #
  # What this can not cover is a log_line_prefix ending in %u or %d, such as
  # `%h %u `, as a account NAMED for a address then sits directly ahead of
  # FATAL where the client address is expected. Keep %h the last field.
  - '^(?!.*\bhost=.*\bhost=)(?!.*password authentication failed for user.*password authentication failed for user).*?\bhost=%%%%SRC%%%%\b.*\bpassword authentication failed for user'
  - '^(?!.*password authentication failed for user.*password authentication failed for user).*?\b%%%%SRC%%%% (?:FATAL|LOG):\s+password authentication failed for user'
src_ip_var: SRC
user_var: pgsql_user
ban_var:
  - SRC
tests:
  positive:
    - message: 'Jul 14 08:15:50 dbhost postgres[12345]: 2026-07-14 08:15:50.123 UTC [12345] bob@maindb 203.0.113.10 FATAL:  password authentication failed for user "bob"'
      found: 1
      data:
        SRC: "203.0.113.10"
    - message: 'Jul 14 08:15:50 dbhost postgres[12345]: 2026-07-14 08:15:50.123 UTC [12345] user=bob,db=maindb,host=198.51.100.5 FATAL:  password authentication failed for user "bob"'
      found: 1
      data:
        SRC: "198.51.100.5"
    - message: 'Jul 14 08:15:50 dbhost postgres[12345]: 2026-07-14 08:15:50.123 UTC [12345] app@db 2001:db8::1 FATAL:  password authentication failed for user "app"'
      found: 1
      data:
        SRC: "2001:db8::1"
    # the ident is configurable, so prove the gate is not the default alone
    - message: 'Jul 14 08:15:51 dbhost postgresql[12345]: 2026-07-14 08:15:51.123 UTC [12345] user=bob,db=maindb,host=198.51.100.6 FATAL:  password authentication failed for user "bob"'
      found: 1
      data:
        SRC: "198.51.100.6"
    - message: 'Jul 14 08:15:52 dbhost postgres-16[12345]: 2026-07-14 08:15:52.123 UTC [12345] bob@maindb 198.51.100.7 FATAL:  password authentication failed for user "bob"'
      found: 1
      data:
        SRC: "198.51.100.7"
  injection:
    # a second host= planted through the account name, ahead of the real one
    # in a prefix that leads with the user. The host= pattern stands aside and
    # the address directly ahead of FATAL is the one taken
    - message: 'Jul 14 08:15:50 dbhost postgres[12345]: 2026-07-14 08:15:50.123 UTC [12345] user=x host=203.0.113.222 y,db=maindb,host=198.51.100.5 FATAL:  password authentication failed for user "x host=203.0.113.222 y"'
      data:
        SRC: "198.51.100.5"
    # the same name against a prefix with no host= of its own... the planted
    # one is then in the line twice, prefix and tail, so it is not taken
    - message: 'Jul 14 08:15:50 dbhost postgres[12345]: 2026-07-14 08:15:50.123 UTC [12345] x host=203.0.113.222 y@maindb 198.51.100.5 FATAL:  password authentication failed for user "x host=203.0.113.222 y"'
      data:
        SRC: "198.51.100.5"
    # and against a prefix holding only the address, where the planted host=
    # is in the tail alone, with no failure text after it to complete a match
    - message: 'Jul 14 08:15:50 dbhost postgres[12345]: 2026-07-14 08:15:50.123 UTC [12345] 198.51.100.5 FATAL:  password authentication failed for user "x host=203.0.113.222 y"'
      data:
        SRC: "198.51.100.5"
    # a account named for a address, ahead of the real one... it is not
    # directly ahead of FATAL, so it is not the address taken
    - message: 'Jul 14 08:15:50 dbhost postgres[12345]: 2026-07-14 08:15:50.123 UTC [12345] 203.0.113.222@maindb 198.51.100.5 FATAL:  password authentication failed for user "203.0.113.222"'
      data:
        SRC: "198.51.100.5"
  negative:
    # a account name holding a address AND the failure text, which forges a
    # whole second failure ahead of the real one. Nothing says which is real,
    # so the line is refused rather than either address being trusted
    - message: 'Jul 14 08:15:50 dbhost postgres[12345]: 2026-07-14 08:15:50.123 UTC [12345] x 203.0.113.222 FATAL:  password authentication failed for user y@maindb 198.51.100.5 FATAL:  password authentication failed for user "x 203.0.113.222 FATAL:  password authentication failed for user y"'
      found: 0
      undefed: ["SRC"]
    # the same forgery through host=
    - message: 'Jul 14 08:15:50 dbhost postgres[12345]: 2026-07-14 08:15:50.123 UTC [12345] user=x,host=203.0.113.222 FATAL:  password authentication failed for user y,db=maindb,host=198.51.100.5 FATAL:  password authentication failed for user "x,host=203.0.113.222 FATAL:  password authentication failed for user y"'
      found: 0
      undefed: ["SRC"]
    - message: 'Jul 14 08:16:00 dbhost postgres[12345]: 2026-07-14 08:16:00.001 UTC [12345] bob@maindb 203.0.113.10 LOG:  connection authorized: user=bob database=maindb'
      found: 0
      undefed: ["SRC"]
    - message: 'Jul 14 08:16:00 dbhost postgres[12345]: 2026-07-14 08:16:00.001 UTC [12345] FATAL:  password authentication failed for user "bob"'
      found: 0
      undefed: ["SRC"]
