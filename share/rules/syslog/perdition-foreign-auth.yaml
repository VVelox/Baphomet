---
# ANY perdition authentication event from outside your home countries, failed
# or successful. See syslog/sshd-foreign-auth for the reasoning, the ordering
# rule, and the traveler risk, all of which apply here unchanged.
#
# Perdition logs one Auth: line per attempt and puts the verdict in a trailing
# status="..." field, so success and failure differ by that field alone. The
# failure spellings are syslog/perdition's, verbatim; the success spelling
# (status="ok") is written from perdition's own output rather than mined from
# a corpus. Confirm the success half against a live log; the failure half is
# corpus-proven either way.
#
# List AHEAD of syslog/perdition: a domestic event is vetoed here without
# being consumed, and falls through to be counted there exactly as before.
rev: 1
msg: "[PERDITION] authentication from outside the home countries"
severity: high
classtype: suspicious-login
daemons:
  - '//^perdition\.//'
message_regexp:
  # the success... the same Auth: line, status="ok"
  - '^Auth: %%%%SRC%%%%:\d+->(?:\d{1,3}\.){3}\d{1,3}:\d+ .*authentication_id="(?<USER>[^"]*)".* status="ok"$'
  # and everything syslog/perdition counts, verbatim
  - '^Auth: %%%%SRC%%%%:\d+->(?:\d{1,3}\.){3}\d{1,3}:\d+ client-secure=\S+ authorisation_id=NONE authentication_id=".+" server="\S+" protocol=\S+ server-secure=\S+ status="failed: (?:local authentication failure|Re-Authentication Failure)"$'
  - '^Fatal Error reading authentication information from client %%%%SRC%%%%:\d+->(?:\d{1,3}\.){3}\d{1,3}:\d+: Exiting child$'
country:
  isnot:
    - "%%%country_codes{home}%%%"
  vars:
    - SRC
ban_var:
  - SRC
max_score: 1
tests:
  positive:
    # a foreign login that worked
    - message: 'Jul 12 08:25:49 vixen42 perdition.imap4[12345]: Auth: 203.0.113.9:41842->192.0.2.1:143 client-secure=ssl authorisation_id=NONE authentication_id="kitsune" server="mail.example.com" protocol=IMAP4 server-secure=ssl status="ok"'
      geo:
        countries:
          "203.0.113.9": NL
        lists:
          home: [ US ]
      found: 1
      data:
        SRC: "203.0.113.9"
        USER: "kitsune"
    # a foreign failure
    - message: 'Jul 12 08:15:50 vixen42 perdition.imap4[12345]: Auth: 198.51.100.23:41843->192.0.2.1:143 client-secure=ssl authorisation_id=NONE authentication_id="moth3r" server="mail.example.com" protocol=IMAP4 server-secure=ssl status="failed: local authentication failure"'
      geo:
        countries:
          "198.51.100.23": DE
        lists:
          home: [ US, CA ]
      found: 1
      data:
        SRC: "198.51.100.23"
    - message: 'Jul 12 08:15:50 vixen42 perdition.pop3[12345]: Fatal Error reading authentication information from client 203.0.113.14:41844->192.0.2.1:110: Exiting child'
      geo:
        countries:
          "203.0.113.14": CN
        lists:
          home: [ US ]
      found: 1
      data:
        SRC: "203.0.113.14"
  negative:
    # domestic success... vetoed, falls through
    - message: 'Jul 12 08:25:49 vixen42 perdition.imap4[12345]: Auth: 198.51.100.5:41842->192.0.2.1:143 client-secure=ssl authorisation_id=NONE authentication_id="kitsune" server="mail.example.com" protocol=IMAP4 server-secure=ssl status="ok"'
      geo:
        countries:
          "198.51.100.5": US
        lists:
          home: [ US ]
      found: 0
    # domestic failure... syslog/perdition's business
    - message: 'Jul 12 08:15:50 vixen42 perdition.imap4[12345]: Auth: 198.51.100.5:41843->192.0.2.1:143 client-secure=ssl authorisation_id=NONE authentication_id="moth3r" server="mail.example.com" protocol=IMAP4 server-secure=ssl status="failed: local authentication failure"'
      geo:
        countries:
          "198.51.100.5": US
        lists:
          home: [ US ]
      found: 0
    # unplaceable... fails closed
    - message: 'Jul 12 08:15:50 vixen42 perdition.imap4[12345]: Auth: 192.0.2.66:41843->192.0.2.1:143 client-secure=ssl authorisation_id=NONE authentication_id="moth3r" server="mail.example.com" protocol=IMAP4 server-secure=ssl status="failed: local authentication failure"'
      geo:
        countries:
          "192.0.2.66": unknown
        lists:
          home: [ US ]
      found: 0
    # a connection notice carries no auth verdict
    - message: 'Jul 12 08:25:49 vixen42 perdition.imap4[12345]: Connect: 203.0.113.9:41842->192.0.2.1:143'
      geo:
        countries:
          "203.0.113.9": NL
        lists:
          home: [ US ]
      found: 0
      undefed: ["SRC"]
