---
# Matches sshd auth failures. Based on the fail2ban sshd filter in its
# normal mode, translated to Baphomet and simplified... the multi-line
# machinery, the mode switching, and the nofail/forget tagging are all
# dropped, so only lines that are themselves failures match.
rev: 4
msg: "[SSHD] authentication failure / brute force"
severity: high
classtype: brute-force
mark:
  - name: brute_force
    ttl: 21600
daemons:
  - sshd
  - sshd-session
mungers:
  - sshd
message_regexp:
  - '^(?:(?:error|fatal): (?:PAM: )?)?[iI](?:llegal|nvalid) user .*? from %%%%SRC%%%%(?: (?:port \d+|on \S+|\[preauth\])){0,3}\s*$'
  - '^(?:(?:error|fatal): (?:PAM: )?)?[aA]uthentication (?:failure|error|failed) for .* from %%%%SRC%%%%(?: via \S+)?(?: (?:port \d+|on \S+|\[preauth\])){0,3}\s*$'
  - '^(?:(?:error|fatal): (?:PAM: )?)?Failed \S+ for (?:invalid user )?.*? from %%%%SRC%%%%(?: (?:port \d+|on \S+)){0,2}(?: ssh\d*)?(?::\s.*?)?(?: \[preauth\])?\s*$'
  - '^(?:(?:error|fatal): (?:PAM: )?)?maximum authentication attempts exceeded for .* from %%%%SRC%%%%(?: (?:port \d+|on \S+)){0,2}(?: ssh\d*)?(?: \[preauth\])?\s*$'
  - '^(?:(?:error|fatal): (?:PAM: )?)?User \S+ from %%%%SRC%%%% not allowed because'
  - '^(?:(?:error|fatal): (?:PAM: )?)?ROOT LOGIN REFUSED.* FROM %%%%SRC%%%%(?: (?:port \d+|\[preauth\])){0,2}\s*$'
  - '^(?:(?:error|fatal): (?:PAM: )?)?refused connect from \S+ \(%%%%SRC%%%%\)'
  - '^pam_[a-z0-9_]+\(sshd:auth\):\s+authentication failure;.*\brhost=%%%%SRC%%%%(?:\s+user=\S*)?\s*$'
  - '^Received disconnect from %%%%SRC%%%%(?: port \d+)?:\s*3: .*Auth fail'
  - '^Did not receive identification string from %%%%SRC%%%%'
  - '^Bad protocol version identification .* from %%%%SRC%%%%(?: port \d+)?\s*$'
  - '^banner exchange: Connection from %%%%SRC%%%%(?: port \d+)?: invalid format'
ban_var:
  - SRC
tests:
  positive:
    - message: "Jul 12 08:15:50 vixen42 sshd-session[66891]: Invalid user moth3r from 216.137.179.214 port 34640"
      found: 1
      data:
        SRC: "216.137.179.214"
    - message: "Jul 12 08:15:50 vixen42 sshd[1094]: error: PAM: Authentication failure for root from 192.0.2.11"
      found: 1
      data:
        SRC: "192.0.2.11"
    - message: "Jul 12 08:15:50 vixen42 sshd[2278]: Failed password for invalid user admin from 192.0.2.7 port 4711 ssh2"
      found: 1
      data:
        SRC: "192.0.2.7"
    - message: "Jul 12 08:15:50 vixen42 sshd-session[2279]: Failed password for root from 2001:db8::badc:0ffe port 62022 ssh2"
      found: 1
      data:
        SRC: "2001:db8::badc:0ffe"
    - message: "Jul 12 08:15:50 vixen42 sshd[3161]: error: maximum authentication attempts exceeded for root from 203.0.113.4 port 4321 ssh2 [preauth]"
      found: 1
      data:
        SRC: "203.0.113.4"
    - message: "Jul 12 08:15:50 vixen42 sshd[4189]: User root from 198.51.100.9 not allowed because not listed in AllowUsers"
      found: 1
      data:
        SRC: "198.51.100.9"
    - message: "Jul 12 08:15:50 vixen42 sshd[5911]: ROOT LOGIN REFUSED FROM 198.51.100.1"
      found: 1
      data:
        SRC: "198.51.100.1"
    - message: "Jul 12 08:15:50 vixen42 sshd[6021]: refused connect from bad.example.com (192.0.2.99)"
      found: 1
      data:
        SRC: "192.0.2.99"
    - message: "Jul 12 08:15:50 vixen42 sshd[7113]: pam_unix(sshd:auth): authentication failure; logname= uid=0 euid=0 tty=ssh ruser= rhost=192.0.2.33  user=root"
      found: 1
      data:
        SRC: "192.0.2.33"
    - message: "Jul 12 08:15:50 vixen42 sshd[8231]: Received disconnect from 192.0.2.55 port 48372: 3: com.jcraft.jsch.JSchException: Auth fail [preauth]"
      found: 1
      data:
        SRC: "192.0.2.55"
    - message: "Jul 12 08:15:50 vixen42 sshd[9145]: Did not receive identification string from 198.51.100.77 port 9922"
      found: 1
      data:
        SRC: "198.51.100.77"
    - message: "Jul 12 08:15:50 vixen42 sshd[9250]: Bad protocol version identification 'GET / HTTP/1.1' from 203.0.113.66 port 44444"
      found: 1
      data:
        SRC: "203.0.113.66"
    - message: "Jul 12 08:15:50 vixen42 sshd[9366]: banner exchange: Connection from 203.0.113.67 port 33321: invalid format"
      found: 1
      data:
        SRC: "203.0.113.67"
    # the auth-info tail a publickey failure carries, which must not be read
    # as a forgery and must not cost the match either
    - message: "Jul 12 08:15:50 mail01 sshd[4669]: Failed publickey for invalid user bob from 192.0.2.7 port 37954 ssh2: RSA SHA256:v3dpapGleDaUKf4V1vKyR9ZyUgjaJAmoCTcb2PLljI"
      found: 1
      data:
        SRC: "192.0.2.7"
    # a IPv4 mapped IPv6 offender is captured whole, not clipped at "::ffff:1"
    - message: "Jul 12 08:15:50 mail01 sshd[1643]: ROOT LOGIN REFUSED FROM ::ffff:1.2.3.4"
      found: 1
      data:
        SRC: "::ffff:1.2.3.4"
  negative:
    - message: "Jul 12 08:25:49 vixen42 sshd-session[36748]: Accepted publickey for kitsune from 127.0.0.1 port 21680 ssh2: ED25519 SHA256:hjUfLIEAIR3ueytAg+XlbiVHmCQSQ6MCEdo2xYbyJ48"
      found: 0
      undefed: ["SRC"]
    - message: "Jul 12 08:25:49 vixen42 sshd[36749]: Connection closed by authenticating user root 192.0.2.3 port 5555 [preauth]"
      found: 0
      undefed: ["SRC"]
    - message: "Jul 12 08:25:49 vixen42 sshd[1]: Server listening on 0.0.0.0 port 22."
      found: 0
      undefed: ["SRC"]
    - message: "Jul 12 08:25:49 vixen42 sshd[8232]: Received disconnect from 192.0.2.55 port 48372: 11: disconnected by user"
      found: 0
      undefed: ["SRC"]
    - message: "Jul 12 08:25:49 vixen42 cron[1234]: Invalid user moth3r from 216.137.179.214 port 34640"
      found: 0
      undefed: ["SRC"]
  injection:
    # An account name is attacker chosen and may hold spaces, so a login as
    # "moth3r from 203.0.113.222" forges a second "from <addr>" ahead of the
    # real one. Every pattern here is anchored past the address for that
    # reason... the tail sshd itself appends is what the match has to land on,
    # so a forged copy can not satisfy it and the offender stays the offender.
    # One entry per sshd shape that carries a wildcard ahead of the address.
    # the same forgery through pam's ruser, which is attacker chosen too
    - message: "Jul 12 08:15:50 mail01 sshd[7113]: pam_unix(sshd:auth): authentication failure; logname= uid=0 euid=0 tty=ssh ruser=rhost=203.0.113.222 rhost=192.0.2.33  user=root"
      data:
        SRC: "192.0.2.33"
    - message: "Jul 12 08:15:50 mail01 sshd[3161]: error: maximum authentication attempts exceeded for bob from 203.0.113.222 port 1 ssh2 from 203.0.113.4 port 4321 ssh2 [preauth]"
      data:
        SRC: "203.0.113.4"
    - message: "Jul 12 08:15:50 mail01 sshd[1094]: error: PAM: Authentication failure for bob from 203.0.113.222 from 192.0.2.11"
      data:
        SRC: "192.0.2.11"
    - message: "Jul 12 08:15:50 mail01 sshd[2278]: Failed password for invalid user bob from 203.0.113.222 port 55555 ssh2 from 216.137.179.214 port 58946 ssh2"
      data:
        SRC: "216.137.179.214"
    - message: "Jul 12 08:15:50 mail01 sshd[2278]: Invalid user moth3r from 203.0.113.222 from 216.137.179.214 port 34640"
      data:
        SRC: "216.137.179.214"
